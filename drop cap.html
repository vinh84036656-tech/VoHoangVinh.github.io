<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop Cap</title>
<style>
  body {
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    line-height: 1.7;
    color: #333;
  }

  .drop-cap::first-letter {
    float: left;
    font-size: 4.5em;
    line-height: 0.85;
    font-weight: bold;
    margin: 0.05em 0.12em 0 0;
    color: #c0392b;
  }
</style>
</head>
<body>

<p class="drop-cap">
  Ngày xửa ngày xưa, ở một vùng quê yên bình, có một cậu bé rất thích đọc sách.
  Mỗi buổi chiều, cậu ngồi dưới gốc cây đa đầu làng, mở từng trang giấy và
  tưởng tượng mình đang phiêu lưu qua những miền đất xa xôi.
</p>

</body>
</html>
