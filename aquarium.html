<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thủy cung đại dương | Hồ cá vui nhộn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mystyle.css">
</head>
<body>
  <!-- Thanh điều hướng chung của website -->
  <header class="site-header">
    <a class="brand" href="index.html">🌊 My Little Website</a>
    <nav aria-label="Điều hướng chính">
      <a href="index.html">Trang chủ</a>
      <a class="active" href="aquarium.html">Hồ cá</a>
      <a href="cv.html">CV cá nhân</a>
      <a href="products.html">Hàng hóa</a>
    </nav>
  </header>

  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">THẾ GIỚI ĐẠI DƯƠNG</p>
        <h1>Hồ cá vui nhộn 🫧</h1>
        <p class="subtitle">Cùng khám phá đại dương xanh!</p>
      </div>
      <div class="controls">
        <button id="sceneBtn" type="button">🌅 Đổi cảnh nền</button>
        <button id="musicBtn" type="button">♫ Bật nhạc</button>
        <button id="pauseBtn" type="button">⏸ Tạm dừng</button>
      </div>
    </header>

    <section class="aquarium scene-one" id="aquarium" aria-label="Hoạt cảnh hồ cá">
      <div class="sunlight"></div>
      <div class="water-shine shine-one"></div>
      <div class="water-shine shine-two"></div>

      <div class="bubble b1"></div><div class="bubble b2"></div>
      <div class="bubble b3"></div><div class="bubble b4"></div>
      <div class="bubble b5"></div><div class="bubble b6"></div>
      <div class="bubble b7"></div><div class="bubble b8"></div>

      <div class="school school-a">
        <img src="faintSchool.png" alt="Đàn cá nhỏ">
        <img src="faintSchool.png" alt="">
        <img src="faintSchool.png" alt="">
      </div>
      <div class="school school-b gold-school">
        <img src="goldFishSchool.png" alt="Đàn cá vàng">
      </div>

      <div class="creature shark">
        <img src="shark.png" alt="Cá mập đang bơi">
      </div>
      <div class="creature turtle">
        <img src="turtle.png" alt="Rùa biển đang bơi">
      </div>
      <div class="creature diver diver-one">
        <img src="diver1.png" alt="Thợ lặn thứ nhất">
      </div>
      <div class="creature diver diver-two">
        <img src="diver2.png" alt="Thợ lặn thứ hai">
      </div>
      <div class="creature diver diver-three">
        <img src="diver3.png" alt="Thợ lặn thứ ba">
      </div>

      <div class="seaweed weed-one"></div>
      <div class="seaweed weed-two"></div>
      <div class="seaweed weed-three"></div>
      <div class="sand"></div>
      <div class="ground-stone stone-one"></div>
      <div class="ground-stone stone-two"></div>
      <div class="ground-stone stone-three"></div>
      <div class="caption">Hãy giữ đại dương luôn xanh 🌊</div>
    </section>
  </main>
  
  <!-- File script.js được gọi đúng chuẩn ở cuối trang -->
  <script src="css/script.js"></script>
</body>
</html>
